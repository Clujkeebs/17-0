<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" preserveAspectRatio="xMidYMid meet"><defs><filter id="gl" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl2" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><style>.orb{transform-origin:100px 100px;animation:orb linear infinite}@keyframes orb{to{transform:rotate(360deg)}}.tw{animation:tw 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes tw{from{opacity:.4;transform:scale(.6)}to{opacity:1;transform:scale(1.15)}}.fb{transform-box:fill-box;transform-origin:center}.fl{transform-box:fill-box;transform-origin:50% 100%;animation-name:flk;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-direction:alternate}@keyframes flk{0%{transform:scale(1,1) skewX(-3deg)}50%{transform:scale(.9,1.14) skewX(4deg)}100%{transform:scale(1.07,.9) skewX(-4deg)}}.em{animation-name:em;animation-timing-function:ease-out;animation-iteration-count:infinite}@keyframes em{from{transform:translate(var(--x),var(--y));opacity:1}to{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) - 70px));opacity:0}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><circle class="em" r="1.57" fill="#fde047" style="--x:161.1px;--y:125.1px;--dx:12px;animation-duration:1.7s;animation-delay:-1.2s"/><circle class="em" r="1.01" fill="#fff3b0" style="--x:148px;--y:130.9px;--dx:-13px;animation-duration:1.8s;animation-delay:-0.4s"/><circle class="em" r="1.25" fill="#fb923c" style="--x:137.3px;--y: