<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" preserveAspectRatio="xMidYMid meet"><defs><filter id="gl" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl2" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><style>.orb{transform-origin:100px 100px;animation:orb linear infinite}@keyframes orb{to{transform:rotate(360deg)}}.tw{animation:tw 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes tw{from{opacity:.4;transform:scale(.6)}to{opacity:1;transform:scale(1.15)}}.fb{transform-box:fill-box;transform-origin:center}.ex{animation:ex 3.6s cubic-bezier(.37,0,.63,1) infinite alternate}@keyframes ex{from{transform:translateX(-64px)}to{transform:translateX(64px)}}.ey{animation:ey 1.8s cubic-bezier(.37,0,.63,1) infinite alternate}@keyframes ey{from{transform:translateY(-34px)}to{transform:translateY(34px)}}.bob{animation:bb .5s ease-in-out infinite alternate}@keyframes bb{from{transform:rotate(-8deg)}to{transform:rotate(8deg)}}.wing{animation:wg .08s linear infinite alternate;transform-box:fill-box;transform-origin:50% 100%}@keyframes wg{from{transform:scaleY(1)}to{transform:scaleY(.3)}}@media (prefers-reduced-motion: reduce){*{animation:none!important}}</style><g transform="translate(100 100)"><g class="ex"><g class="ey"><g class="bob"><g transform="scale(1.5)"><g class="wing"><ellipse cx="-3" cy="-7" rx="7" ry="4" fill="#e0f2fe" opacity=".8"/><ellipse cx="4" cy="-7" rx="7" ry="4" fill="#e0f2fe" opacity=".8"/></g><ellipse rx="10" ry="6.4" fill="#facc15" stroke="#111" stroke-width="1.2"/><path d="M-3.4-5.6V5.6M1.4-6.2V6.2M6-5V5" stroke="#111" stroke-width="2.4"/><circle cx="10" cy="-.6" r="2.8" fill="#111"/><path d="M-10 0L-14 1" stroke="#111" stroke-width="1.2" stroke-linecap="round"/></g></g></g></g></g></svg>