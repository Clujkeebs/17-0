<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 200 200" width="200" height="200" preserveAspectRatio="xMidYMid meet"><defs><filter id="gl" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="2.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="gl2" x="-120%" y="-120%" width="340%" height="340%"><feGaussianBlur stdDeviation="4.5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="bl" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3"/></filter></defs><style>.orb{transform-origin:100px 100px;animation:orb linear infinite}@keyframes orb{to{transform:rotate(360deg)}}.tw{animation:tw 1.3s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}@keyframes tw{from{opacity:.4;transform:scale(.6)}to{opacity:1;transform:scale(1.15)}}.fb{transform-box:fill-box;transform-origin:center}.fl{transform-box:fill-box;transform-origin:50% 100%;animation-name:flk;animation-iteration-count:infinite;animation-timing-function:ease-in-out;animation-direction:alternate}@keyframes flk{0%{transform:scale(1,1) skewX(-3deg)}50%{transform:scale(.9,1.14) skewX(4deg)}100%{transform:scale(1.07,.9) skewX(-4deg)}}.em{animation-name:em;animation-timing-function:ease-out;animation-iteration-count:infinite}@keyframes em{from{transform:translate(var(--x),var(--y));opacity:1}to{transform:translate(calc(var(--x) + var(--dx)),calc(var(--y) - 70px));opacity:0}}</style><circle class="em" r="1.88" fill="#e0f7ff" filter="url(#gl)" style="--x:146.4px;--y:48.1px;--dx:-8px;animation-duration:3.6s;animation-delay:-1.2s"/><circle class="em" r="2.08" fill="#e0f7ff" filter="url(#gl)" style="--x:139.6px;--y:148.8px;--dx:-1px;animation-duration:2.8s;animation-delay:-0.8s"/><circle class="em" r="1.62" fill="#e0f7ff" filter="url(#gl)" style="--x:131.4px;--y:145px;--dx:9px;animation-duration:2.5s;animation-delay:-2.5s"/><circle class="em" r="2.07" fill="#e0f7ff" filter="url(#gl)" style="--x:61.4px;--y:145.6px;--dx:8px;animation-duration:2.9s;animation-delay:-0.7s"/><circle class="em" r="1.07" fill="#e0f7ff" filter="url(#gl)" style="--x:71.2px;--y:43.1px;--dx:-3px;animation-duration:3.5s;animation-delay:-2.7s"/><circle class="em" r="2.06" fill="#e0f7ff" filter="url(#gl)" style="--x:154.4px;--y:86.1px;--dx:6px;animation-duration:3.4s;animation-delay:-1s"/><circle class="em" r="1.57" fill="#e0f7ff" filter="url(#gl)" style="--x:70.3px;--y:162.1px;--dx:10px;animation-duration:2.7s;animation-delay:-0.2s"/><circle class="em" r="1.65" fill="#e0f7ff" filter="url(#gl)" style="--x:36.6px;--y:125px;--dx:-5px;animation-duration:2.2s;animation-delay:-0.1s"/><circle class="em" r="1.31" fill="#e0f7ff" filter="url(#gl)" style="--x:120.4px;--y:161.4px;--dx:-4px;animation-duration:3.6s;animation-delay:-1s"/><circle class="em" r="1.9" fill="#e0f7ff" filter="url(#gl)" style="--x:161.3px;--y:109.8px;--dx:3px;animation-duration:3.8s;animation-delay:-1.9s"/><circle class="em" r="1.34" fill="#e0f7ff" filter="url(#gl)" style="--x:144px;--y:59.1px;--dx:-9px;animation-duration:3.3s;animation-delay:-1.9s"/><circle class="em" r="1.95" fill="#e0f7ff" filter="url(#gl)" style="--x:160.6px;--y:79.5px;--dx:3px;animation-duration:3.9s;animation-delay:-2.6s"/><circle class="em" r="1.44" fill="#e0f7ff" filter="url(#gl)" style="--x:43.8px;--y:87px;--dx:3px;animation-duration:3.4s;animation-delay:-3.4s"/><circle class="em" r="1.99" fill="#e0f7ff" filter="url(#gl)" style="--x:50.2px;--y:63.9px;--dx:3px;animation-duration:3.5s;animation-delay:-2.6s"/><circle class="em" r="1.35" fill="#e0f7ff" filter="url(#gl)" style="--x:155.4px;--y:86.1px;--dx:2px;animation-duration:3.7s;animation-delay:-0.2s"/><circle class="em" r="1.35" fill="#e0f7ff" filter="url(#gl)" style="--x:62.8px;--y:53.3px;--dx:6px;animation-duration:3.5s;animation-delay:-0.8s"/></svg>