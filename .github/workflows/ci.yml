name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: gridiron }
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/gridiron
      REDIS_URL: redis://localhost:6379
      AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      CRON_SECRET: ci
      SITE_URL: http://localhost:3000
      NEXTAUTH_URL: http://localhost:3000
      # The account e2e test signs in as this address and checks the admin dashboard.
      ADMIN_EMAILS: you@example.com
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run db:migrate && npm run db:seed
      - run: npm run build && npm run build:worker
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with: { name: playwright-report, path: test-results }
